[project]
name = "semantic-layer-harness-bench"
version = "0.1.0"
description = "Benchmark how model, data interface (raw SQL, glossary, dbt MetricFlow, Malloy) and harness drive an analytics agent's accuracy"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "duckdb",
    "pydantic-ai-slim[anthropic]",
    "anthropic<2",  # anthropic 2.x made BetaMessageParam a Union, which pydantic-ai 2.59 cannot instantiate
    "pydantic-ai-harness",
    "pyyaml",
    "mlflow>=3.17.2",
    "dbt-metricflow[dbt-duckdb]>=0.15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
