[project]
name = "semantic-layer-bench"
version = "0.1.0"
description = "Benchmark AI agents answering business questions over raw SQL, Malloy and dbt MetricFlow"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "duckdb",
    "pydantic-ai-slim[anthropic]",
    "anthropic<2",  # anthropic 2.x made BetaMessageParam a Union, which pydantic-ai 2.59 cannot instantiate
    "pydantic-evals",
    "pydantic-ai-harness",
    "pyyaml",
    "mlflow>=3.17.2",
    "dbt-metricflow[dbt-duckdb]>=0.15.0",
]

[tool.uv]
package = false
